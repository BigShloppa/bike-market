services:
  db:
    image: postgres:16
    container_name: bike_market_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bike
      POSTGRES_PASSWORD: bike123
      POSTGRES_DB: bike_market
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata: